aid: cron
name: Cron
description: >-
  Cron was a next-generation calendar application for professionals and teams, backed by Initialized
  Capital and later acquired by Notion, where it was rebranded and relaunched as Notion Calendar. The
  product offered a fast, keyboard-driven desktop and mobile calendar with multi-account scheduling,
  time-zone handling, team availability, and deep Notion workspace integration (calendar events linked
  to Notion pages and databases). Cron is an end-user consumer product and does not expose a public
  developer API, OpenAPI definition, SDKs, or developer portal; its public surface is a marketing site,
  a dated changelog (retired January 2024 at the Notion Calendar rebrand), a blog, and help
  documentation now hosted within Notion. This profile captures Cron's public identity and
  domain-security posture for the API Evangelist network.
